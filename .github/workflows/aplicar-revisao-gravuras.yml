name: Aplicar revisão individual das gravuras

on:
  push:
    branches:
      - revisao-gravuras-eita-lasqueira
    paths:
      - .github/workflows/aplicar-revisao-gravuras.yml

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Classificar as 60 gravuras no Markdown
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          small = {'image3.jpeg', 'image4.jpeg', 'image58.jpeg'}
          medium = {'image2.jpeg', 'image33.png', 'image37.jpeg', 'image39.jpeg', 'image43.jpeg', 'image49.jpeg'}
          full = {
              'image5.jpeg', 'image15.jpeg', 'image18.jpeg', 'image19.jpeg',
              'image30.jpeg', 'image31.jpeg', 'image32.jpeg', 'image35.jpeg',
              'image36.jpeg', 'image41.jpeg', 'image44.jpeg', 'image48.jpeg',
              'image50.jpeg', 'image54.jpeg', 'image57.jpeg'
          }

          def cls_for(src):
              name = src.rsplit('/', 1)[-1]
              if name in small:
                  return 'illustration-small'
              if name in medium:
                  return 'illustration-medium'
              if name in full:
                  return 'illustration-full'
              return 'illustration-large'

          def clean_style(tag):
              m = re.search(r'\sstyle="([^"]*)"', tag, flags=re.I)
              if not m:
                  return tag
              kept = []
              for rule in m.group(1).split(';'):
                  rule = rule.strip()
                  if not rule:
                      continue
                  prop = rule.split(':', 1)[0].strip().lower()
                  if prop in {'width', 'max-width'}:
                      continue
                  kept.append(rule)
              if kept:
                  replacement = ' style="' + '; '.join(kept) + ';"'
              else:
                  replacement = ''
              return tag[:m.start()] + replacement + tag[m.end():]

          def revise_tag(tag):
              sm = re.search(r'src="([^"]+)"', tag, flags=re.I)
              if not sm or '/eita-lasqueira/media/' not in sm.group(1):
                  return tag
              cls = cls_for(sm.group(1))
              tag = clean_style(tag)
              cm = re.search(r'\sclass="([^"]*)"', tag, flags=re.I)
              if cm:
                  classes = [c for c in cm.group(1).split() if not c.startswith('illustration-')]
                  classes.append(cls)
                  replacement = ' class="' + ' '.join(classes) + '"'
                  tag = tag[:cm.start()] + replacement + tag[cm.end():]
              else:
                  tag = tag.replace('<img', f'<img class="{cls}"', 1)
              return tag

          total = 0
          classes = {'illustration-small': 0, 'illustration-medium': 0, 'illustration-large': 0, 'illustration-full': 0}
          for path in sorted(Path('src/content/eita-lasqueira').glob('*.md')):
              text = path.read_text(encoding='utf-8')
              def repl(m):
                  nonlocal_holder[0] += 1
                  new = revise_tag(m.group(0))
                  cm = re.search(r'class="([^"]*illustration-[^"]*)"', new)
                  if cm:
                      for c in cm.group(1).split():
                          if c in classes:
                              classes[c] += 1
                  return new
              nonlocal_holder = [0]
              updated = re.sub(r'<img\b[^>]*>', repl, text, flags=re.I)
              total += nonlocal_holder[0]
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          if total != 60:
              raise SystemExit(f'Esperadas 60 gravuras; encontradas {total}')
          if sum(classes.values()) != 60:
              raise SystemExit(f'Nem todas as gravuras receberam classe: {classes}')
          print('Classificação:', classes)
          PY

      - name: Conferir resíduos de largura inline
        run: |
          if grep -R -nE '<img[^>]*style="[^"]*(width|max-width):' src/content/eita-lasqueira/*.md; then
            echo 'Ainda há largura inline em gravuras.'
            exit 1
          fi
          test "$(grep -Rho 'illustration-\(small\|medium\|large\|full\)' src/content/eita-lasqueira/*.md | wc -l)" -eq 60
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validar build
        run: |
          npm ci
          npm run build

      - name: Gravar revisão das gravuras
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/eita-lasqueira/*.md
          git commit -m "Classifica individualmente as gravuras do livro" || exit 0
          git push
