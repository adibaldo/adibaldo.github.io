          total = 0
          missed = []
          for filename, pairs in R.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              before = text
              count = 0
              for old, new in pairs:
                  if old in text:
                      n = text.count(old)
                      text = text.replace(old, new)
                      count += n
                  else:
                      missed.append((filename, old))
              if text != before:
                  path.write_text(text, encoding='utf-8')
              total += count
              print(f'{filename}: {count} substituições')

          print(f'TOTAL: {total} substituições')
          if missed:
              print('Padrões não encontrados (podem já estar corrigidos ou ter grafia diferente):')
              for filename, old in missed:
                  print(f'- {filename}: {old!r}')
          PY

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validar build
        run: |
          npm ci
          npm run build

      - name: Gravar revisão nos Markdown
        run: |
          if git diff --quiet -- src/content/eita-lasqueira; then
            echo "Nenhuma alteração adicional."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/eita-lasqueira/*.md
          git commit -m "Revisa demais partes de Eita Lasqueira"
          git push origin HEAD:revisao-abertura
